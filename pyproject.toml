[project]
name = "mcp-chaos"
version = "0.2.0"
description = "Chaos engineering for the MCP tool-call plane: fault injection + reliability metrics for agent tool use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ajin Baby" }]
keywords = ["mcp", "model-context-protocol", "chaos-engineering", "reliability", "sre", "agents"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
proxy = ["httpx>=0.27", "fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.16,<0.17", "httpx>=0.27", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
mcp-chaos = "mcp_chaos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_chaos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
