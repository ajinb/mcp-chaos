# Example mcp-chaos fault plan. Apply with: mcp-chaos proxy stdio --plan fault-plan.example.yaml -- <server cmd>
seed: 42
faults:
  - type: latency
    added_ms: 250
    probability: 0.3
  - type: error_injection
    rate: 0.02
  - type: schema_drift
    tools: ["get_metrics"]
    probability: 0.1
  # Correlated faults (paper §6, Table II) — uncomment to replace iid error_injection:
  # - type: burst_error          # failures arrive in bursts, same marginal rate
  #   rate: 0.02
  #   burst_len: 16              # mean burst length in calls; 1 ~= iid
  # - type: server_degradation   # a whole server's tools fail together
  #   tools: ["get_logs", "get_traces"]
  #   episode_rate: 0.08         # stationary fraction of degraded tasks
  #   episode_len: 20            # mean episode length in tasks
